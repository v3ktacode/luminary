[package]
name = "msp_rust"
version = "0.1.1"
edition = "2021"

[profile.dev]
opt-level = 1
debug = "limited"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3 
lto = "fat" 
codegen-units = 1  
strip = true       
panic = "abort"   
incremental = false

[profile.test]
opt-level = 1
debug = "limited"

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[dependencies]
dashmap = "5"
eframe = "0.28"
serenity = { version = "0.12", features = ["client", "gateway", "rustls_backend", "model", "cache"] }
dotenvy = "0.15"
httpdate = "1"
tokio-util = "0.7"
axum = "0.7"
wreq = { version = "6.0.0-rc.29", features = [
    "json",
    "cookies",
    "gzip",
    "brotli",
    "zstd",
    "ws"
] } 
wreq-util = "3.0.0-rc.14"
encoding_rs = "0.8"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
serde            = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
base64 = "0.22"
bson = "2"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util      = "0.3"
rustls            = { version = "0.23", features = ["ring"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.23"
percent-encoding = "2.3"
rpassword      = "7"
hmac    = "0.12"
sha2    = "0.10"

obfstr = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio       = { version = "1", features = ["full", "test-util"] }
tokio-test  = "0.4"
wiremock    = "0.6"
